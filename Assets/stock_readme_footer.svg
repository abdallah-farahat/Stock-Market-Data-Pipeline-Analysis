<svg viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070c"/>
      <stop offset="100%" stop-color="#13131e"/>
    </linearGradient>
    <pattern id="dots2" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <filter id="glow3" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round2"><rect x="0" y="0" width="1200" height="150" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round2)">
    <rect width="1200" height="150" fill="url(#bg2)"/>
    <rect width="1200" height="150" fill="url(#dots2)"/>

    <text x="600" y="62" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="20" fill="#FFB300" filter="url(#glow3)" letter-spacing="2">BUILT SOLO — MICROSOFT STUDENT AMBASSADORS, DATA ENGINEERING TRACK</text>
    <text x="600" y="90" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#9aa0ad" letter-spacing="0.5">Abdallah Ali Abdelgawad  ·  github.com/abdallah-farahat</text>

    <g font-family="'Courier New', monospace" font-size="13" font-weight="600" opacity="0.7">
      <circle cx="474" cy="118" r="3" fill="#00E676"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="486" y="122" fill="#8f95a3">idempotent</text>
      <circle cx="600" cy="118" r="3" fill="#FFB300"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
      <text x="612" y="122" fill="#8f95a3">audited</text>
      <circle cx="704" cy="118" r="3" fill="#00E676"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
      <text x="716" y="122" fill="#8f95a3">reproducible</text>
    </g>
  </g>
</svg>
