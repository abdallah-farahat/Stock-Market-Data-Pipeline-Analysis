<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070c"/>
      <stop offset="100%" stop-color="#13131e"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="320" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>

    <!-- faint background candlestick chart -->
    <g opacity="0.16">
      <line x1="45"  y1="150" x2="45"  y2="230" stroke="#00E676" stroke-width="2"/><rect x="37" y="170" width="16" height="45" fill="#00E676"/>
      <line x1="95"  y1="130" x2="95"  y2="210" stroke="#FF5252" stroke-width="2"/><rect x="87" y="140" width="16" height="55" fill="#FF5252"/>
      <line x1="145" y1="160" x2="145" y2="245" stroke="#00E676" stroke-width="2"/><rect x="137" y="190" width="16" height="35" fill="#00E676"/>
      <line x1="195" y1="110" x2="195" y2="200" stroke="#00E676" stroke-width="2"/><rect x="187" y="120" width="16" height="65" fill="#00E676"/>
      <line x1="245" y1="150" x2="245" y2="225" stroke="#FF5252" stroke-width="2"/><rect x="237" y="160" width="16" height="45" fill="#FF5252"/>
      <line x1="295" y1="170" x2="295" y2="235" stroke="#00E676" stroke-width="2"/><rect x="287" y="180" width="16" height="40" fill="#00E676"/>
      <line x1="345" y1="120" x2="345" y2="215" stroke="#00E676" stroke-width="2"/><rect x="337" y="135" width="16" height="60" fill="#00E676"/>
      <line x1="395" y1="160" x2="395" y2="230" stroke="#FF5252" stroke-width="2"/><rect x="387" y="170" width="16" height="45" fill="#FF5252"/>
      <line x1="805" y1="140" x2="805" y2="220" stroke="#00E676" stroke-width="2"/><rect x="797" y="150" width="16" height="55" fill="#00E676"/>
      <line x1="855" y1="170" x2="855" y2="235" stroke="#FF5252" stroke-width="2"/><rect x="847" y="180" width="16" height="40" fill="#FF5252"/>
      <line x1="905" y1="110" x2="905" y2="205" stroke="#00E676" stroke-width="2"/><rect x="897" y="125" width="16" height="65" fill="#00E676"/>
      <line x1="955" y1="150" x2="955" y2="225" stroke="#00E676" stroke-width="2"/><rect x="947" y="160" width="16" height="50" fill="#00E676"/>
      <line x1="1005" y1="130" x2="1005" y2="215" stroke="#FF5252" stroke-width="2"/><rect x="997" y="140" width="16" height="55" fill="#FF5252"/>
      <line x1="1055" y1="160" x2="1055" y2="240" stroke="#00E676" stroke-width="2"/><rect x="1047" y="175" width="16" height="45" fill="#00E676"/>
      <line x1="1105" y1="120" x2="1105" y2="205" stroke="#00E676" stroke-width="2"/><rect x="1097" y="135" width="16" height="60" fill="#00E676"/>
      <line x1="1155" y1="150" x2="1155" y2="230" stroke="#FF5252" stroke-width="2"/><rect x="1147" y="165" width="16" height="45" fill="#FF5252"/>
    </g>

    <!-- title -->
    <text x="600" y="132" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="42" fill="#FFB300" filter="url(#glow)" letter-spacing="3">STOCK MARKET DATA PIPELINE</text>
    <text x="600" y="170" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" fill="#9aa0ad" letter-spacing="1.5">OHLCV INGESTION  ·  DATA QUALITY AUDIT  ·  POSTGRESQL WAREHOUSE  ·  AIRFLOW ORCHESTRATION</text>

    <!-- ticker tape strip -->
    <rect x="0" y="255" width="1200" height="44" fill="#000000" opacity="0.55"/>
    <line x1="0" y1="255" x2="1200" y2="255" stroke="#FFB300" stroke-opacity="0.25"/>
    <line x1="0" y1="299" x2="1200" y2="299" stroke="#FFB300" stroke-opacity="0.25"/>
    <clipPath id="tapeClip"><rect x="0" y="255" width="1200" height="44"/></clipPath>
    <g clip-path="url(#tapeClip)">
      <g font-family="'Courier New', monospace" font-size="16" font-weight="700">
        <g id="tape">
          <text x="0"   y="283" fill="#e8e8ec">AAPL <tspan fill="#00E676">&#9650;</tspan></text>
          <text x="140" y="283" fill="#e8e8ec">MSFT <tspan fill="#FF5252">&#9660;</tspan></text>
          <text x="280" y="283" fill="#e8e8ec">AMZN <tspan fill="#00E676">&#9650;</tspan></text>
          <text x="420" y="283" fill="#e8e8ec">GOOGL <tspan fill="#00E676">&#9650;</tspan></text>
          <text x="580" y="283" fill="#e8e8ec">META <tspan fill="#FF5252">&#9660;</tspan></text>
          <text x="720" y="283" fill="#e8e8ec">TSLA <tspan fill="#00E676">&#9650;</tspan></text>
          <text x="860" y="283" fill="#e8e8ec">NVDA <tspan fill="#00E676">&#9650;</tspan></text>
          <text x="1000" y="283" fill="#e8e8ec">JPM <tspan fill="#FF5252">&#9660;</tspan></text>
          <text x="1130" y="283" fill="#e8e8ec">JNJ <tspan fill="#00E676">&#9650;</tspan></text>
          <text x="1260" y="283" fill="#e8e8ec">V <tspan fill="#00E676">&#9650;</tspan></text>
          <!-- duplicate set for seamless loop -->
          <text x="1400" y="283" fill="#e8e8ec">AAPL <tspan fill="#00E676">&#9650;</tspan></text>
          <text x="1540" y="283" fill="#e8e8ec">MSFT <tspan fill="#FF5252">&#9660;</tspan></text>
          <text x="1680" y="283" fill="#e8e8ec">AMZN <tspan fill="#00E676">&#9650;</tspan></text>
          <text x="1820" y="283" fill="#e8e8ec">GOOGL <tspan fill="#00E676">&#9650;</tspan></text>
          <text x="1980" y="283" fill="#e8e8ec">META <tspan fill="#FF5252">&#9660;</tspan></text>
          <text x="2120" y="283" fill="#e8e8ec">TSLA <tspan fill="#00E676">&#9650;</tspan></text>
          <text x="2260" y="283" fill="#e8e8ec">NVDA <tspan fill="#00E676">&#9650;</tspan></text>
          <text x="2400" y="283" fill="#e8e8ec">JPM <tspan fill="#FF5252">&#9660;</tspan></text>
          <text x="2530" y="283" fill="#e8e8ec">JNJ <tspan fill="#00E676">&#9650;</tspan></text>
          <text x="2660" y="283" fill="#e8e8ec">V <tspan fill="#00E676">&#9650;</tspan></text>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-1400 0" dur="26s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>
  </g>
</svg>
